<title>Sorry Nisha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:ital,wght@1,600&family=Caveat:wght@500;600&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: one full-screen story, seven stages fade into each other. Softer rose-and-lilac look, single committed light theme. */
:root{
  --bg:#fdf4f8; --bg2:#e9dcf8; --ink:#5e1f45; --rose:#d94a78; --rose2:#f4799f;
  --lilac:#7d4fc0; --muted:#9a5b82; --paper:#58394f;
  --f-display:'Parisienne','Brush Script MT',cursive;
  --f-serif:'Cormorant Garamond',Georgia,serif;
  --f-hand:'Caveat','Segoe Script',cursive;
  --f-ui:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0; position:relative; overflow:hidden; color:var(--ink); font-family:var(--f-ui);
  background-color:var(--bg);
  background-image:
    radial-gradient(60% 40% at 12% 6%, #ffffff 0%, rgba(255,255,255,0) 70%),
    radial-gradient(75% 55% at 100% 100%, var(--bg2) 0%, rgba(233,220,248,0) 75%);
}
*{box-sizing:border-box}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

.stage{
  position:absolute; inset:0; z-index:2; display:flex; overflow-y:auto; overflow-x:hidden;
  padding-block:56px 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  opacity:0; visibility:hidden; transition:opacity .7s ease, visibility .7s;
  text-align:center;
}
.stage.on{opacity:1; visibility:visible}
.col{margin:auto; width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center; gap:18px; min-width:0}

.display{font:400 clamp(38px,11vw,56px)/1.1 var(--f-display); color:var(--rose); text-shadow:0 2px 14px rgba(244,121,159,.35); text-wrap:balance; margin:0}
.sub{font:italic 600 clamp(16px,4.4vw,19px)/1.45 var(--f-serif); color:var(--muted); max-width:32ch; margin:0; text-wrap:balance}
.head2{font:italic 600 clamp(25px,7vw,32px)/1.2 var(--f-serif); color:#7a2352; margin:0; text-wrap:balance}
.msg{font:italic 600 clamp(18px,5vw,21px)/1.4 var(--f-serif); color:var(--rose); min-height:3em; max-width:30ch; margin:0; text-wrap:balance}

.btn{
  font:800 17px var(--f-ui); color:#fff; border:0; padding:13px 34px; border-radius:999px; cursor:pointer;
  background:linear-gradient(180deg,var(--rose2),var(--rose));
  box-shadow:0 12px 22px -9px rgba(217,74,120,.75);
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn:active{transform:scale(.96)}
.btn.ghost{background:#fff;color:var(--rose);box-shadow:0 8px 18px -10px rgba(120,40,90,.5)}
.btn:focus-visible,.ico:focus-visible,#mute:focus-visible,.env:focus-visible,.pun:focus-visible,#rng:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.row{display:flex; flex-wrap:wrap; justify-content:center; gap:12px}

.frame{width:min(78vw,300px); border-radius:18px; overflow:hidden; background:#fff4ea; box-shadow:0 22px 36px -20px rgba(120,40,90,.55), 0 0 0 6px #fff}
.frame svg{display:block; width:100%; height:auto}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.rise{animation:rise 3.4s ease-in infinite; opacity:0}
.rise.d2{animation-delay:1.1s}.rise.d3{animation-delay:2.2s}
@keyframes rise{0%{transform:translateY(8px);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}

/* gussa slider */
.face{font-size:84px; line-height:1; transition:transform .2s ease}
.face.tick{transform:scale(1.12)}
#rng{width:min(100%,320px); height:34px; accent-color:var(--rose); cursor:pointer; margin:0}
.rv{font:400 44px/1 var(--f-display); color:var(--rose)}

/* sazaa */
.puns{display:flex; flex-direction:column; gap:10px; width:100%}
.pun{
  display:flex; align-items:center; gap:12px; text-align:left; width:100%; cursor:pointer;
  background:#fff; border:2px solid transparent; border-radius:14px; padding:13px 16px;
  font:600 clamp(19px,5vw,21px)/1.25 var(--f-hand); color:var(--paper);
  box-shadow:0 12px 20px -16px rgba(120,40,90,.6); transition:border-color .2s ease, background .2s ease;
}
.pun::before{content:"\2661"; font:400 24px/1 var(--f-ui); color:#d9a3bb; flex:none}
.pun.sel{border-color:var(--rose); background:#fff0f5}
.pun.sel::before{content:"\2665"; color:var(--rose)}

/* envelope + letter */
.stack{display:grid; width:100%; justify-items:center}
.stack>*{grid-area:1/1}
.env{position:relative; width:min(78vw,320px); aspect-ratio:8/5; perspective:900px; cursor:pointer; transition:opacity .6s ease, transform .6s ease}
.env .back{position:absolute; inset:0; border-radius:6px; background:linear-gradient(#f3e4f6,#e3cdf0); box-shadow:0 20px 30px -14px rgba(100,40,120,.45)}
.env .front{position:absolute; inset:0; border-radius:6px; background:linear-gradient(135deg,#fbf0fa,#ecd6f3); clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
.env .flap{position:absolute; left:0; top:0; width:100%; height:55%; background:linear-gradient(#d9b8ec,#cba6e4); clip-path:polygon(0 0,100% 0,50% 100%); transform-origin:top; transition:transform .8s ease}
.env .seal{position:absolute; left:50%; top:55%; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; background:var(--rose); display:grid; place-items:center; box-shadow:0 4px 10px rgba(160,20,60,.4); transition:opacity .4s ease}
.env .seal svg{width:16px;height:16px}
.env.open .flap{transform:rotateX(180deg)}
.env.open .seal{opacity:0}
.env.gone{opacity:0; transform:translateY(24px) scale(.96); pointer-events:none}
.letter{
  width:min(100%,380px); max-height:min(54vh,430px); overflow-y:auto; text-align:left;
  background:#fff; border-radius:14px; padding:22px 24px; box-shadow:0 22px 38px -22px rgba(120,40,90,.6);
  font:600 clamp(20px,5.4vw,23px)/1.42 var(--f-hand); color:var(--paper); white-space:pre-wrap;
  opacity:0; transform:translateY(24px) scale(.97); pointer-events:none; transition:opacity .7s ease, transform .7s ease;
}
.letter.show{opacity:1; transform:none; pointer-events:auto}
.caret{display:inline-block; width:2px; height:1em; background:var(--rose); vertical-align:-.12em; margin-left:2px; animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* kasamein */
.icons{display:flex; gap:14px; justify-content:center}
.ico{width:54px;height:54px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 18px -8px rgba(120,40,90,.5);transition:transform .2s ease, background .3s ease}
.ico svg{width:25px;height:25px}
.ico.on{background:linear-gradient(135deg,#a45fd0,#6a35b0); color:#fff!important; transform:scale(1.1)}
.rcard{width:min(100%,340px); min-height:118px; background:#fff; border-radius:16px; padding:16px 20px; box-shadow:0 18px 30px -20px rgba(120,40,90,.6); display:flex; flex-direction:column; justify-content:center; gap:4px}
.rcard h3{font:400 30px/1.1 var(--f-display); margin:0}
.rcard p{font:600 clamp(19px,5vw,21px)/1.35 var(--f-hand); margin:0; color:var(--paper)}
.rcard.hint p{font:italic 600 18px/1.4 var(--f-serif); color:#b98aa8}
.rcard.pop{animation:pop .45s ease}
@keyframes pop{from{opacity:.2;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

/* finale */
.polaroid{background:#fff; padding:12px 12px 26px; border-radius:6px; transform:rotate(-2deg); box-shadow:0 24px 36px -20px rgba(120,40,90,.6); width:min(70vw,280px)}
.polaroid svg{display:block;width:100%;height:auto;border-radius:3px}
.eq{font:400 clamp(28px,8vw,38px)/1.15 var(--f-display); color:var(--lilac); margin:0}
.note{font:600 clamp(19px,5vw,21px)/1.35 var(--f-hand); color:var(--paper); margin:0; max-width:32ch}
.sign{font:400 30px var(--f-display); color:var(--rose); margin:0}

#mute{position:fixed; z-index:6; top:calc(env(safe-area-inset-top, 0px) + 10px); right:calc(env(safe-area-inset-right, 0px) + 12px); width:40px; height:40px; border-radius:50%; border:0; background:rgba(255,255,255,.85); color:var(--muted); display:grid; place-items:center; cursor:pointer; box-shadow:0 4px 12px -4px rgba(120,40,90,.4)}
#mute svg{width:20px;height:20px}

@media (prefers-reduced-motion: reduce){
  .bob,.rise,.caret{animation:none}
  .rise{opacity:1}
  .stage,.letter,.env,.env .flap,.face{transition-duration:.01s}
}
</style>

<button id="mute" type="button" aria-label="Music on or off"></button>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- 0 intro -->
<section class="stage on" id="s0"><div class="col">
  <h1 class="display" id="t0"></h1>
  <div class="frame bob" id="art0"></div>
  <p class="sub" id="p0"></p>
  <button class="btn" id="go0" type="button">Theek hai, bolo</button>
</div></section>

<!-- 1 gussa meter -->
<section class="stage" id="s1"><div class="col">
  <h2 class="display">Pehle ye batao...</h2>
  <p class="sub">Abhi tumhara gussa kitna hai? Slider ko sarkao.</p>
  <div class="face" id="face" aria-hidden="true">&#128524;</div>
  <input type="range" id="rng" min="0" max="100" value="0" aria-label="Gussa kitna hai">
  <div class="rv" id="rv">0%</div>
  <p class="msg" id="rmsg"></p>
  <button class="btn" id="n1" type="button" hidden>Ab main kuch bolun?</button>
</div></section>

<!-- 2 sazaa -->
<section class="stage" id="s2"><div class="col">
  <h2 class="display">Meri sazaa tum chuno</h2>
  <p class="sub">Jitni chaho utni chuno. Main sab karunga.</p>
  <div class="puns" id="puns"></div>
  <button class="btn" id="n2" type="button" hidden>Sazaa manzoor hai</button>
</div></section>

<!-- 3 letter -->
<section class="stage" id="s3"><div class="col">
  <h2 class="head2">Ek khat, sirf tumhare liye...</h2>
  <div class="stack">
    <div class="env" id="env" role="button" tabindex="0" aria-label="Envelope kholo">
      <div class="back"></div><div class="front"></div><div class="flap"></div>
      <div class="seal"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 20.5s-8-4.8-8-10.6C4 6.9 6 5 8.4 5c1.5 0 2.8.8 3.6 2 .8-1.2 2.1-2 3.6-2C18 5 20 6.9 20 9.9c0 5.8-8 10.6-8 10.6z"/></svg></div>
    </div>
    <div class="letter" id="letter" aria-live="polite"></div>
  </div>
  <p class="sub" id="p3">Envelope par tap karo.</p>
  <button class="btn" id="n3" type="button" hidden>Aage</button>
</div></section>

<!-- 4 kasamein -->
<section class="stage" id="s4"><div class="col">
  <h2 class="display">Meri 4 kasamein</h2>
  <p class="sub">Har icon ek waada hai. Sab dekh lo.</p>
  <div class="icons" id="icons"></div>
  <div class="rcard hint" id="rcard"><p>Upar ke icons dabao.</p></div>
  <button class="btn" id="n4" type="button" hidden>Aakhri sawaal</button>
</div></section>

<!-- 5 ask -->
<section class="stage" id="s5"><div class="col">
  <h2 class="display" id="t5"></h2>
  <div class="frame" id="art5"></div>
  <p class="msg" id="amsg"></p>
  <div class="row">
    <button class="btn" id="yes" type="button">Maaf kiya &#128151;</button>
    <button class="btn ghost" id="later" type="button">Thoda aur time chahiye</button>
  </div>
</div></section>

<!-- 6 finale -->
<section class="stage" id="s6"><div class="col">
  <div class="polaroid" id="art6"></div>
  <h2 class="display" id="t6"></h2>
  <p class="eq" id="eq"></p>
  <p class="note" id="plist"></p>
  <p class="sub" id="hugmsg"></p>
  <p class="sign" id="sign"></p>
  <div class="row">
    <button class="btn" id="hug" type="button">Ek jhappi &#129303;</button>
    <button class="btn ghost" id="replay" type="button">Phir se dekho</button>
  </div>
</div></section>

<script>
(function(){
'use strict';

/* ---- Edit these to personalise ---- */
var CONFIG={
  her:'Nisha',
  from:'Muftashir',
  letter:[
    'Meri Nisha \u{1F497},',

    {icon:'sparkle',color:'#c0489f',title:'Samjhunga',text:'Sirf sunna nahi, samajhne ki koshish bhi karunga. Dil se.'},
    {icon:'smile',color:'#d3921a',title:'Pyaar pehle',text:'Bahas se pehle pyaar. Jeetna mujhe nahi hai, humein hai.'},
    {icon:'star',color:'#7d4fc0',title:'Hamesha saath',text:'Achhe din, bure din, naraz din. Har din tumhare saath.'}
  ]
};
var BANDS=[
  {max:20,face:'\u{1F642}',msg:'Itna sa? Main to dar gaya tha.'},
  {max:50,face:'\u{1F612}',msg:'Theek hai, itna to banta hai.'},
  {max:80,face:'\u{1F620}',msg:'Samajh gaya. Aaj main sab sunne ko tayyar hoon.'},
  {max:100,face:'\u{1F621}',msg:'Bilkul sahi gussa. Main kaan pakad ke khada hoon.'}
];
var LATERMSG=[
  'Bilkul theek hai. Jitna time chahiye lo. Main yahin hoon, kahin nahi ja raha \u{1F497}',
  'Koi jaldi nahi hai, Nisha. Jab dil kare tab bolna. Tab tak main intezaar karunga.',
  'Main wahin hoon jahan tum chhod ke gayi thi. Tumhara intezaar \u{1F497}'
];

var $=function(id){return document.getElementById(id)};
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var ICONS={
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 20.5s-8-4.8-8-10.6C4 6.9 6 5 8.4 5c1.5 0 2.8.8 3.6 2 .8-1.2 2.1-2 3.6-2C18 5 20 6.9 20 9.9c0 5.8-8 10.6-8 10.6z"/></svg>',
  sparkle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M10 4l1.9 5.6L17.5 11.5l-5.6 1.9L10 19l-1.9-5.6L2.5 11.5l5.6-1.9z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>',
  smile:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 14c1 1.8 2.4 2.6 4 2.6s3-.8 4-2.6"/><circle cx="9" cy="10" r=".7" fill="currentColor"/><circle cx="15" cy="10" r=".7" fill="currentColor"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg>'
};

/* ---- illustrations (original characters) ---- */
function heartPath(x,y,s,fill,cls){

var cv=$('fx'), c=cv.getContext('2d'), W=0, H=0, parts=[], petals=[];
var COLS=['#f4799f','#ffb3c7','#e0a63a','#7d4fc0','#a98be0','#ffffff'];
function size(){var d=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0);}
addEventListener('resize',size);size();
function heart(x,y,s){c.beginPath();c.moveTo(x,y+s*.35);c.bezierCurveTo(x-s,y-s*.4,x-s*.7,y-s,x,y-s*.5);c.bezierCurveTo(x+s*.7,y-s,x+s,y-s*.4,x,y+s*.35);c.fill();}
function burst(x,y,n){
  if(reduce)n=Math.round(n/4);
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,sp=3+Math.random()*7;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,r:4+Math.random()*5,c:COLS[(Math.random()*COLS.length)|0],rot:Math.random()*6,vr:(Math.random()-.5)*.3,h:Math.random()<.55,life:1});}
}
function rain(n){
  if(reduce)n=Math.round(n/4);
  for(var i=0;i<n;i++){parts.push({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:4+Math.random()*5,c:COLS[(Math.random()*COLS.length)|0],rot:Math.random()*6,vr:(Math.random()-.5)*.25,h:Math.random()<.6,life:1,fall:true});}
}
if(!reduce){for(var k=0;k<14;k++)petals.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:6+Math.random()*9,v:.25+Math.random()*.45,p:Math.random()*6});}
function frame(){
  c.clearRect(0,0,W,H);
  c.fillStyle='rgba(217,74,120,.18)';
  petals.forEach(function(p){p.y-=p.v;p.p+=.012;if(p.y<-20){p.y=H+20;p.x=Math.random()*W;}heart(p.x+Math.sin(p.p)*14,p.y,p.s);});
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.fall?.02:.22;p.vx*=.99;p.rot+=p.vr;
    if(!p.fall)p.life-=.011;
    if(p.y>H+30||p.life<=0){parts.splice(i,1);continue;}
    c.globalAlpha=Math.max(0,Math.min(1,p.life));c.fillStyle=p.c;
    if(p.h){heart(p.x,p.y,p.r*1.4);}else{c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);c.restore();}
  }
  c.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---- soft music box (generated) ---- */
var ac=null,master=null,tick=null,idx=0,musicOn=false;
var CH=[[220,261.63,329.63,440],[174.61,220,261.63,349.23],[261.63,329.63,392,523.25],[196,246.94,293.66,392]];
var PAT=[0,1,2,3,2,1,2,1];
function note(f){
  var t=ac.currentTime;
  [[f,'sine',.5],[f*2,'triangle',.12]].forEach(function(v){
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=v[1];o.frequency.value=v[0];
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v[2],t+.02);g.gain.exponentialRampToValueAtTime(.0008,t+1.7);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+1.8);
  });
}
function step(){var ch=CH[Math.floor(idx/8)%4];note(ch[PAT[idx%8]]);idx++;}
var SPK_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';
var SPK_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function paintMute(){var b=$('mute');b.innerHTML=musicOn?SPK_ON:SPK_OFF;b.setAttribute('aria-pressed',String(musicOn));}
function musicStart(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(!master){master=ac.createGain();master.gain.value=.2;master.connect(ac.destination);}
    if(ac.resume)ac.resume();
    if(!tick)tick=setInterval(step,430);
    musicOn=true;
  }catch(e){musicOn=false;}
  paintMute();
}
function musicStop(){if(tick){clearInterval(tick);tick=null;}musicOn=false;paintMute();}
$('mute').addEventListener('click',function(){musicOn?musicStop():musicStart();});
paintMute();

/* ---- flow ---- */
var cur=0;
function go(n){
  $('s'+cur).classList.remove('on');
  var b=$('s'+n);b.classList.add('on');b.scrollTop=0;cur=n;
  if(n===6)setTimeout(function(){burst(W/2,H*.35,80);rain(70);},500);
}
$('go0').addEventListener('click',function(){musicStart();go(1);});

/* 1: gussa slider */
function band(v){for(var i=0;i<BANDS.length;i++){if(v<=BANDS[i].max)return BANDS[i];}return BANDS[BANDS.length-1];}
var lastFace='';
$('rng').addEventListener('input',function(){
  var v=+this.value,b=band(v);
  $('rv').textContent=v+'%';
  $('rmsg').textContent=b.msg;
  if(b.face!==lastFace){lastFace=b.face;var f=$('face');f.textContent=b.face;f.classList.add('tick');setTimeout(function(){f.classList.remove('tick')},180);}
  $('n1').hidden=false;
});
$('n1').addEventListener('click',function(){go(2);});

/* 2: sazaa */
var chosen={};
function buildPuns(){
  var box=$('puns');box.innerHTML='';chosen={};
  CONFIG.puns.forEach(function(t,i){
    var b=document.createElement('button');b.type='button';b.className='pun';b.textContent=t;b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){
      var on=b.classList.toggle('sel');b.setAttribute('aria-pressed',String(on));
      if(on)chosen[i]=true;else delete chosen[i];
      $('n2').hidden=Object.keys(chosen).length===0;
      if(on){var r=b.getBoundingClientRect();burst(r.left+30,r.top+r.height/2,14);}
    });
    box.appendChild(b);
  });
  $('n2').hidden=true;
}
buildPuns();
$('n2').addEventListener('click',function(){go(3);});

/* 3: letter */
var stopType=null;
function typeInto(el,text,done){
  var chars=Array.from(text),i=0,caret=document.createElement('span'),tn=document.createTextNode('');
  caret.className='caret';el.textContent='';el.appendChild(tn);el.appendChild(caret);
  var iv=null;
  function fin(){if(iv){clearInterval(iv);iv=null;}tn.nodeValue=text;if(caret.parentNode)caret.remove();el.onclick=null;el.scrollTop=el.scrollHeight;if(done)done();}
  iv=setInterval(function(){i++;tn.nodeValue=chars.slice(0,i).join('');el.scrollTop=el.scrollHeight;if(i>=chars.length)fin();},reduce?3:26);
  el.onclick=fin;
  return function(){if(iv){clearInterval(iv);iv=null;}el.onclick=null;};
}
function openEnv(){
  var env=$('env');
  if(env.classList.contains('open'))return;
  env.classList.add('open');
  $('p3').textContent='Letter par tap karo, jaldi padhne ke liye.';
  setTimeout(function(){
    env.classList.add('gone');
    var L=$('letter');L.classList.add('show');
    stopType=typeInto(L,CONFIG.letter.join('\n\n'),function(){$('p3').textContent='';$('n3').hidden=false;});
  },900);
}
$('env').addEventListener('click',openEnv);
$('env').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openEnv();}});
$('n3').addEventListener('click',function(){go(4);});

/* 4: kasamein */
var seen={};
CONFIG.vows.forEach(function(r,i){
  var b=document.createElement('button');
  b.type='button';b.className='ico';b.style.color=r.color;b.innerHTML=ICONS[r.icon];b.setAttribute('aria-label',r.title);
  b.addEventListener('click',function(){
    document.querySelectorAll('.ico').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');
    var card=$('rcard');card.className='rcard';
    card.innerHTML='<h3></h3><p></p>';
    card.firstChild.style.color=r.color;card.firstChild.textContent=r.title;card.lastChild.textContent=r.text;
    void card.offsetWidth;card.classList.add('pop');
    var rect=b.getBoundingClientRect();burst(rect.left+rect.width/2,rect.top+rect.height/2,22);
    seen[i]=true;
    if(Object.keys(seen).length===CONFIG.vows.length)$('n4').hidden=false;
  });
  $('icons').appendChild(b);
});
$('n4').addEventListener('click',function(){go(5);});

/* 5: forgive, with no pressure */
var laterN=0;
$('later').addEventListener('click',function(){
  $('amsg').textContent=LATERMSG[laterN%LATERMSG.length];laterN++;
});
$('yes').addEventListener('click',function(){
  var list=CONFIG.puns.filter(function(t,i){return chosen[i];});
  $('plist').textContent=list.length?'Tumhari chuni hui sazaa, kal se shuru: '+list.join('; ')+'.':'';
  $('plist').hidden=!list.length;
  $('hugmsg').textContent='Maaf karne ke liye shukriya. Waada raha, ab se pehle sununga.';
  go(6);
});

/* 6: finale */
$('hug').addEventListener('click',function(){
  burst(W/2,H*.5,100);rain(60);
  $('hugmsg').textContent='Jhappi bhej di. Pakad lo, bahut tight wali \u{1F917}\u{1F497}';
});
$('s6').addEventListener('click',function(e){
  if(e.target.closest&&e.target.closest('button'))return;
  burst(e.clientX,e.clientY,18);
});
$('replay').addEventListener('click',function(){
  if(stopType){stopType();stopType=null;}
  laterN=0;
  $('rng').value=0;$('rv').textContent='0%';$('rmsg').textContent='';$('face').textContent='\u{1F60C}';lastFace='';$('n1').hidden=true;
  buildPuns();
  $('env').classList.remove('open','gone');$('letter').classList.remove('show');$('letter').textContent='';
  $('p3').textContent='Envelope par tap karo.';$('n3').hidden=true;
  seen={};document.querySelectorAll('.ico').forEach(function(x){x.classList.remove('on')});
  var card=$('rcard');card.className='rcard hint';card.innerHTML='<p>Upar ke icons dabao.</p>';$('n4').hidden=true;
  $('amsg').textContent='Jo bhi tumhara jawab ho, main sunne ko tayyar hoon.';
  go(0);
});
$('face').textContent='\u{1F60C}';
})();
</script>
